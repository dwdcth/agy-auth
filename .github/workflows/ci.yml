name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test --locked

      - name: Build (host, release)
        run: cargo build --locked --release

  zig-cross-build:
    name: Zig cross build - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-0.17.0-x86_64-linux

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -C - \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1

      - name: Add Zig to PATH
        run: echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cross compile
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

      - name: Smoke check
        run: file target/${{ matrix.target }}/release/agy-auth
